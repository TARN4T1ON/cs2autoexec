//
// general
//

bind "w" "+forward"
bind "a" "+moveleft"
bind "s" "+back"
bind "d" "+moveright"
bind "ctrl" "+duck"
bind "shift" "+speed"
bind "space" "+jump"

bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"
bind "6" "slot12"

bind "e" "+use; r_cleardecals"
bind "r" "+reload"
bind "b" "buymenu"

bind "f1" "radio1"
bind "f2" "radio2"

bind "tab" "+showscores"

bind "x" "+spray_menu"

bind "y" "say"
bind "c" "say_team"

bind "g" "+voicerecord"

bind "z" "drop"

bind "=" "toggleconsole"
bind "\" "show_loadout_toggle"

bind "mwheelup" "+jump"
bind "mwheeldown" "+jump"

bind "mouse1" "+attack"
bind "mouse2" "+attack2"
bind "mouse3" "player_ping"

//
// buy
//

// alphabet
alias "armor" "buy vest; buy vesthelm"
alias "rifle" "buy ak47; buy m4a1; buy m4a1-s"
alias "deagle" "buy deagle"
alias "awp" "buy awp"
alias "defuser" "buy defuser"
alias "nadedefense" "buy smokegrenade; buy incgrenade; buy molotov; buy flashbang; buy flashbang"
alias "nadeoffense" "buy hegrenade; buy incgrenade; buy molotov; buy flashbang; buy flashbang"
alias "nadeall" "buy smokegrenade; buy incgrenade; buy molotov; buy hegrenade; buy flashbang"
alias "antieco" "buy mac10; buy mp9; armor; deagle"
alias "ecorifle" "buy galilar; buy famas; armor"
alias "scoot" "buy scout"

// bind

//numpad 7
bind kp_home "rifle"
//numpad 8
bind kp_uparrow "deagle"
//numpad 9
bind kp_pgup "awp"

//numpad 4
bind kp_leftarrow "nadeall"
//numpad 5
bind kp_5 "nadedefense"
//numpad 6
bind kp_rightarrow "nadeoffense"

//numpad 1
bind kp_end "antieco"
//numpad 2
bind kp_downarrow "ecorifle"
//numpad 3
bind kp_pgdn "scoot"

//numpad 0
bind kp_ins "armor"
//numpad ,
bind kp_del "defuser"


//
// other
//

bindtoggle "f4" "net_graph"
net_graphproportionalfont 0.5

bind "f3" "toggle cl_righthand"

