//
// crosshair
//

// crosshair color

cl_crosshairalpha "255"
	// uint_8 (0-255) crosshair transparency
cl_crosshairusealpha "1"
	// bool (0-1) use transparency value
	
cl_crosshaircolor "5"
	// enum (0-5) crosshair color:
		// 0: red
		// 1: green
		// 2: yellow
		// 3: blue
		// 4: cyan
		// 5: custom
cl_crosshaircolor_r "255"
	// uint_8 (0-255) red component
cl_crosshaircolor_g "0"
	// uint_8 (0-255) green component
cl_crosshaircolor_b "255"
	// uint_8 (0-255) blue component

// crosshair body

cl_crosshairgap "-3.0" 
	// float gap in center of crosshair
cl_crosshairsize "2.0" 
	// float length of crosshair
cl_crosshairstyle "4" 
	// enum :
		// 0: default
		// 1: default static
		// 2: accurate split
		// 3: moving
		// 4: custom
		// 5: css like
cl_fixedcrosshairgap "0.0" 
	// float fixed gap for crosshairstyle 1
cl_crosshairthickness "0.5" 
	// float crosshair thickness
cl_crosshair_drawoutline "1" 
	// bool (0-1) draw outline
cl_crosshair_outlinethickness "0.0" 
	// float outline thickness
	
cl_crosshair_dynamic_splitdist "2.0"
	// float
cl_crosshair_dynamic_maxdist_splitratio "0.4"
	// float
cl_crosshair_dynamic_splitalpha_innermod "1.0"
	// float
cl_crosshair_dynamic_splitalpha_outermod "1.0"
	// float

// crosshair misc

cl_crosshairgap_useweaponvalue "0" 
	// bool (0-1) change crosshair gap based on weapon

cl_crosshairdot "0" 
	// bool (0-1) dot in middle of crosshair
cl_crosshair_t "0" 
	// bool (0-1) remove upper part of crosshair

cl_crosshair_sniper_width "1" 
	// float width of sniper scope crosshair

//
// msg
//

echo "...................."
echo "crosshair.cfg loaded"

host_writeconfig