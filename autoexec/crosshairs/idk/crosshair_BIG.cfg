//[CROSSHAIR]
//------------------------------
cl_crosshairalpha "255"					//crosshair transparency
cl_crosshairusealpha "1"				//use transparency value
cl_crosshaircolor "5"					//crosshair color : 1=red, 2=, 3=, 4=, 5=custom
cl_crosshaircolor_b "255"				//blue value of custom crosshair color 
cl_crosshaircolor_r "255"				//red value of custom crosshair color
cl_crosshaircolor_g "0"					//green value of custom crosshair color

cl_crosshairgap "2"						//gap in center of crosshair
cl_crosshairsize "8"					//length of crosshair
cl_crosshairstyle "4"					//1=default, 2=custom with moving part, 3=moving, 4=custom, 5=cs:s like
cl_crosshairthickness "1"				//crosshair thickness ¯\_(ツ)_/¯
cl_fixedcrosshairgap "0"				//fixed gap in center of crosshair for moving crosshair styles
cl_crosshair_drawoutline "1"			//draw outline
cl_crosshair_outlinethickness "1"		//outline thickness

cl_crosshairgap_useweaponvalue "0"		//change crosshair gap based on weapon

cl_crosshairdot "0"						//dot in middle of crosshair
cl_crosshair_t "0"						//removes upper part of crosshair

cl_crosshair_sniper_width "1"			//width of sniper scope crosshair

//[MSG]
//------------------------------
echo "...................."
echo "crosshair.cfg loaded"

host_writeconfig