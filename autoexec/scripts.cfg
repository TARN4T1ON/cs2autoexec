//
// inspect
//
alias +inspect "-lookatweapon; +reload"
alias -inspect "+lookatweapon; -reload"
bind mouse4 "+inspect"

//
// crouch jump
//
alias +crouchjump "+jump; +duck"
alias -crouchjump "-jump; -duck"
bind mouse5 "+crouchjump"

//
// quickswitch
//
alias +quickswitch "slot3"
alias -quickswitch "lastinv"
bind q +quickswitch

//
// jump throw
//
alias "+jumpthrow" "+jump; -attack"
alias "-jumpthrow" "-jump"
bind t "+jumpthrow"

//
// afk
//
alias "_afk" "+afk"
alias +afk "+right; alias _afk "-afk""
alias -afk "-right; alias _afk "+afk""
bind l "_afk"

//
// lineup crosshair
//
alias +lineup "cl_crosshaircolor "0"; cl_crosshairgap "-7"; cl_crosshairsize "1080"; cl_crosshairstyle "4"; cl_crosshairthickness "1"; cl_fixedcrosshairgap "-7"; cl_crosshairdot "1"; cl_crosshair_drawoutline "1"; cl_crosshair_outlinethickness "1""
alias -lineup "exec autoexec/crosshairs/crosshair.cfg"
bind alt "+lineup"

//
// killfeed damage
//
developer "1"
con_enable "1"
con_filter_text "Damage"
con_filter_text_out "Player:"
con_filter_enable "2"

//
// low fps toggle
//
// alias "lowfps" "+lowfps"
// alias "+lowfps" "fps_max 15; alias "lowfps" "-lowfps""
// alias "-lowfps" "fps_max 0; alias "lowfps" "+lowfps""
// bind "." "lowfps"

//
// "spinbot"
//
alias "_spin" "+spin"
alias "+spin" "sensitivity 1000; alias "_spin" "-spin""
alias "-spin" "sens1; alias "_spin" "+spin""
bind "," "_spin"

